<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorTitle != null ? errorTitle : 'Tracking Link Unavailable'} + ' — RideX'">Tracking Link Unavailable — RideX</title>
    <link rel="stylesheet" th:href="@{'/css/ridex-theme.css'}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(at 10% 20%, rgba(16, 185, 129, 0.06) 0px, transparent 50%),
                        radial-gradient(at 90% 10%, rgba(99, 102, 241, 0.05) 0px, transparent 50%),
                        var(--rx-bg-primary, #f8fafc);
            color: #0f172a;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .error-card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 460px;
            width: 90%;
            text-align: center;
            box-shadow: 0 24px 50px -12px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.03);
            position: relative;
            overflow: hidden;
        }
        .error-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(239, 68, 68, 0.8), transparent);
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.08);
            border: 1.5px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 24px;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.12);
        }
        h2 {
            margin: 0 0 12px;
            font-size: 1.55rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.02em;
        }
        p {
            color: #475569;
            font-size: 1rem;
            line-height: 1.6;
            margin: 0 0 32px;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 30px;
            border-radius: 14px;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 10px 24px -6px rgba(16, 185, 129, 0.35);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -6px rgba(16, 185, 129, 0.45);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="error-card rx-float">
        <div class="icon-circle">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 th:text="${errorTitle}">Live Tracking Unavailable</h2>
        <p th:text="${errorMessage}">This link has expired or is invalid. Please contact the rider to obtain an updated tracking URL.</p>
        <a href="/" class="btn-home rx-3d-btn">
            <i class="fa-solid fa-house"></i> Go to RideX Home
        </a>
    </div>
</body>
</html>
