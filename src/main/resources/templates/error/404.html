<!DOCTYPE html>
<html lang="en" th:replace="~{index :: parent(~{::#content},~{::title},~{::script})}">
<head>
    <title>404 — Destination Not Found — RideX</title>
</head>
<body>
<div id="content" style="background: var(--rx-bg-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 120px 20px 80px;">
    <div class="rx-card-3d rx-reveal" style="max-width: 520px; width: 100%; text-align: center; padding: 48px 36px; background: var(--rx-surface); border: 1px solid var(--rx-border); border-radius: var(--rx-radius-xl); box-shadow: var(--rx-shadow-xl);">
        <div style="width: 80px; height: 80px; border-radius: 50%; background: rgba(5,150,105,0.1); color: var(--rx-accent); display: inline-flex; align-items: center; justify-content: center; font-size: 2.2rem; margin-bottom: 20px; box-shadow: 0 4px 16px var(--rx-accent-glow);">
            <i class="fa-solid fa-map-location-dot"></i>
        </div>
        <h1 style="font-size: 5rem; font-weight: 800; line-height: 1; margin: 0 0 10px; font-family: var(--rx-font-display); background: linear-gradient(135deg, var(--rx-accent), #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">404</h1>
        <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--rx-text-primary); margin: 0 0 12px; letter-spacing: -0.02em;">Destination Route Not Found</h2>
        <p style="font-size: 1rem; line-height: 1.6; color: var(--rx-text-secondary); margin: 0 0 8px;" th:text="${errorMessage}">The page or ride you are looking for has been moved or doesn't exist.</p>
        <p style="font-size: 0.85rem; color: var(--rx-text-muted); margin: 0 0 28px; word-break: break-all;" th:if="${requestUri}" th:text="${requestUri}"></p>
        <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
            <a href="/" class="rx-btn rx-btn-primary" style="padding: 12px 28px; font-weight: 700;">
                <i class="fa-solid fa-house"></i> Return Home
            </a>
            <a href="/searchRide" class="rx-btn rx-btn-outline" style="padding: 12px 24px; font-weight: 600;">
                <i class="fa-solid fa-magnifying-glass"></i> Search Rides
            </a>
        </div>
    </div>
</div>
</body>
<script>
    console.log("404 Error Page");
</script>
</html>
