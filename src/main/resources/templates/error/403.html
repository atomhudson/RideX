<!DOCTYPE html>
<html lang="en" th:replace="~{index :: parent(~{::#content},~{::title},~{::script})}">
<head>
    <title>403 — Access Restricted — RideX</title>
</head>
<body>
<div id="content" style="background: var(--rx-bg-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 120px 20px 80px;">
    <div class="rx-card-3d rx-reveal" style="max-width: 520px; width: 100%; text-align: center; padding: 48px 36px; background: var(--rx-surface); border: 1px solid var(--rx-border); border-radius: var(--rx-radius-xl); box-shadow: var(--rx-shadow-xl);">
        <div style="width: 80px; height: 80px; border-radius: 50%; background: rgba(245,158,11,0.12); color: #f59e0b; display: inline-flex; align-items: center; justify-content: center; font-size: 2.2rem; margin-bottom: 20px;">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 style="font-size: 5rem; font-weight: 800; line-height: 1; margin: 0 0 10px; font-family: var(--rx-font-display); background: linear-gradient(135deg, #f59e0b, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">403</h1>
        <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--rx-text-primary); margin: 0 0 12px; letter-spacing: -0.02em;">Access Restricted</h2>
        <p style="font-size: 1rem; line-height: 1.6; color: var(--rx-text-secondary); margin: 0 0 8px;" th:text="${errorMessage}">You do not have the necessary permissions to access this portal or resource.</p>
        <p style="font-size: 0.85rem; color: var(--rx-text-muted); margin: 0 0 28px; word-break: break-all;" th:if="${requestUri}" th:text="${requestUri}"></p>
        <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
            <a href="/" class="rx-btn rx-btn-primary" style="padding: 12px 28px; font-weight: 700;">
                <i class="fa-solid fa-house"></i> Return Home
            </a>
            <a href="/login" class="rx-btn rx-btn-outline" style="padding: 12px 24px; font-weight: 600;">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In Again
            </a>
        </div>
    </div>
</div>
</body>
<script>
    console.log("403 Error Page");
</script>
</html>
