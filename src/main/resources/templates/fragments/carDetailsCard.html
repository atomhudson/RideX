<div th:fragment="carDetails">
    <div class="rx-card rx-card-3d" style="display: flex; flex-direction: row; gap: 24px; max-width: 820px; padding: 0; overflow: hidden; border: 1px solid var(--rx-border); border-radius: var(--rx-radius-xl);">
        <div style="flex: 0 0 280px; min-height: 220px; background: linear-gradient(135deg, rgba(16,185,129,0.08) 0%, rgba(99,102,241,0.08) 100%); display: flex; align-items: center; justify-content: center; position: relative;">
            <img th:if="${carDtoDetails.car_Image_Url != null and !#strings.isEmpty(carDtoDetails.car_Image_Url)}"
                 th:src="${carDtoDetails.car_Image_Url}" alt="Car Image"
                 style="width: 100%; height: 100%; object-fit: cover;" />
            <div th:unless="${carDtoDetails.car_Image_Url != null and !#strings.isEmpty(carDtoDetails.car_Image_Url)}"
                 style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--rx-accent);">
                <i class="fa-solid fa-car-side" style="font-size: 3.5rem;"></i>
                <span style="font-size: 0.8rem; font-weight: 700; color: var(--rx-text-muted);">Verified Vehicle</span>
            </div>
        </div>
        <div style="flex: 1; padding: 28px; display: flex; flex-direction: column; justify-content: center;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px;">
                <div>
                    <h3 style="font-family: var(--rx-heading-font); font-size: 1.45rem; font-weight: 800; color: var(--rx-text-primary); margin: 0 0 4px;"
                        th:text="${carDtoDetails.carMake} + ' ' + ${carDtoDetails.carModel} + ' ' + (${carDtoDetails.year != null ? carDtoDetails.year : ''})">Toyota Corolla 2022</h3>
                    <div style="font-size: 0.82rem; font-family: monospace; background: var(--rx-surface-alt); border: 1px solid var(--rx-border); padding: 3px 8px; border-radius: 6px; display: inline-block; font-weight: 700; color: var(--rx-text-secondary);"
                         th:text="${carDtoDetails.carNumber}">AB12CD3456</div>
                </div>
                <span class="rx-badge" style="background: rgba(16,185,129,0.12); color: #059669; font-weight: 800; font-size: 0.74rem;">
                    <i class="fa-solid fa-shield-check"></i> REGISTERED
                </span>
            </div>

            <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;">
                <span class="rx-badge" style="font-size: 0.82rem;"><strong>Body:</strong>&nbsp;<span th:text="${carDtoDetails.carType}">Sedan</span></span>
                <span class="rx-badge" style="font-size: 0.82rem;"><strong>Fuel:</strong>&nbsp;<span th:text="${carDtoDetails.fuelType}">Petrol</span></span>
                <span class="rx-badge" style="font-size: 0.82rem;"><strong>Color:</strong>&nbsp;<span th:text="${carDtoDetails.color}">White</span></span>
                <span class="rx-badge" style="font-size: 0.82rem; background: rgba(16,185,129,0.1); color: var(--rx-accent);">
                    <i class="fa-solid fa-users" style="margin-right: 4px;"></i><strong>Capacity:</strong>&nbsp;<span th:text="${carDtoDetails.seat_available}">4</span> seats
                </span>
            </div>

            <div style="display: flex; gap: 20px; font-size: 0.88rem; color: var(--rx-text-secondary); border-top: 1px solid var(--rx-border); padding-top: 14px;">
                <div><i class="fa-solid fa-snowflake" style="color: #06b6d4; margin-right: 6px;"></i>Air Conditioning: <strong style="color: var(--rx-text-primary);" th:text="${carDtoDetails.ac_available ? 'Available' : 'No'}">Yes</strong></div>
            </div>
        </div>
    </div>
</div>
